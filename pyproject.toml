[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dell-servicetag-mcp"
version = "1.0.0"
description = "MCP server die informatie (model, verzenddatum, garantie, componenten) over Dell service tags opvraagt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
dell-servicetag-mcp = "dell_servicetag_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dell_servicetag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
